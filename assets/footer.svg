<svg width="1200" height="100" viewBox="0 0 1200 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sakura gradient (same as header) -->
    <linearGradient id="sakura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD6E0"/>
      <stop offset="35%" stop-color="#FFBECB"/>
      <stop offset="65%" stop-color="#FF9CAD"/>
      <stop offset="100%" stop-color="#FF78BC"/>
    </linearGradient>

    <!-- Sakura flower petal -->
    <g id="petal">
      <ellipse cx="0" cy="-7" rx="3" ry="7" fill="#FFFFFF" opacity="0.4"/>
    </g>

    <!-- 5-petal sakura flower -->
    <g id="flower">
      <use href="#petal" transform="rotate(0)"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="2.4" fill="#FFF0F3" opacity="0.8"/>
    </g>
  </defs>

  <!-- Background with wave top (inverted) -->
  <path d="
    M 0,100
    H 1200
    V 45
    C 1100,5  1000,75  800,42
    C 600,8   500,78   300,40
    C 100,3   0,72     0,35
    Z
  " fill="url(#sakura)"/>

  <!-- Sakura flowers -->
  <use href="#flower" transform="translate(150, 65) scale(0.55)"/>
  <use href="#flower" transform="translate(620, 58) scale(0.48)"/>
  <use href="#flower" transform="translate(1070, 62) scale(0.52)"/>

  <!-- Floating petals -->
  <ellipse cx="300" cy="72" rx="2.2" ry="4.5" fill="#FFFFFF" opacity="0.28" transform="rotate( 25, 300, 72)"/>
  <ellipse cx="760" cy="76" rx="2.5" ry="5.0" fill="#FFFFFF" opacity="0.28" transform="rotate(-30, 760, 76)"/>
  <ellipse cx="920" cy="58" rx="2.0" ry="4.0" fill="#FFFFFF" opacity="0.25" transform="rotate( 40, 920, 58)"/>
  <ellipse cx="470" cy="82" rx="2.0" ry="4.2" fill="#FFFFFF" opacity="0.25" transform="rotate(-15, 470, 82)"/>
  <ellipse cx="50"  cy="60" rx="2.0" ry="4.0" fill="#FFFFFF" opacity="0.22" transform="rotate( 50, 50, 60)"/>
  <ellipse cx="830" cy="85" rx="1.8" ry="3.8" fill="#FFFFFF" opacity="0.22" transform="rotate(-45, 830, 85)"/>

  <!-- Sparkle dots -->
  <circle cx="250" cy="50" r="1.5" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="550" cy="45" r="1.2" fill="#FFFFFF" opacity="0.40"/>
  <circle cx="880" cy="48" r="1.5" fill="#FFFFFF" opacity="0.42"/>
  <circle cx="700" cy="68" r="1.2" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="400" cy="55" r="1.0" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="980" cy="65" r="1.0" fill="#FFFFFF" opacity="0.35"/>
</svg>
